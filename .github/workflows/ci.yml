name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Smoke install (dry-run)
        run: node bin/aka-kit.js install --nextjs --dry-run

      - name: Doctor + prepublish gate
        run: node scripts/prepublish-check.mjs
